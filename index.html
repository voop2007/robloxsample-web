<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxSample - Códigos y Guías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sticky top-0 z-40 neo-glass">
        <div class="container-wide flex items-center justify-between h-16 px-4 mx-auto max-w-7xl">
            
            <div id="logoAdminTrigger" class="flex items-center space-x-4 cursor-pointer select-none shrink-0">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-electric to-magenta-cyber rounded-lg flex items-center justify-center">
                    <i class="fas fa-gamepad text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-bold titanium-title">RobloxSample</h1>
            </div>

            <nav class="menu-scroll-custom space-x-4 md:space-x-6">
                <button onclick="showSection('inicio')" class="nav-cyber">Inicio</button>
                <button onclick="showSection('juegos')" class="nav-cyber">Códigos</button>
                <button onclick="showSection('ropa')" class="nav-cyber">Ropa</button>
                <button onclick="showSection('robux')" class="nav-cyber">Robux</button>
            </nav>

            </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <section id="inicio" class="section-padding tab-content">
            <div class="container-wide">
                <div class="neo-glass p-8 max-w-4xl mx-auto text-center rounded-2xl">
                    <h2 class="text-5xl font-bold mb-6 titanium-title">🎁 Sorteo Exclusivo</h2>
                    <p class="text-xl text-gray-300 mb-8">Participa por Robux y items limitados.</p>
                    <div id="sorteoContainer" class="max-w-md mx-auto">
                        <div id="countdown" class="countdown-cyber mb-6 hidden">45</div>
                        <div class="progress-cyber hidden" id="progressBar">
                            <div class="progress-cyber-fill" id="progressFill"></div>
                        </div>
                        <button id="participarBtn" class="btn-cyber px-10 py-4 rounded-xl text-lg font-bold">
                            Participar Ahora
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="juegos" class="section-padding tab-content hidden">
            <div class="container-wide px-4">
                <h2 class="text-4xl font-bold mb-8 text-center titanium-title">🎮 Códigos de Juegos</h2>
                
                <div class="max-w-md mx-auto mb-8 relative">
                    <input id="searchInput" type="text" oninput="filterGames()" placeholder="Buscar tu juego favorito..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition-all">
                </div>

                <div id="gamesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <p class="text-center text-zinc-500 col-span-full py-8">Cargando base de datos...</p>
                </div>
            </div>
        </section>

        <section id="ropa" class="tab-content hidden section-padding">
            <div class="container-wide text-center">
                <h2 class="text-4xl font-bold mb-6 titanium-title">👕 Ropa Limitada</h2>
                <div id="clothingContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <p class="text-center text-zinc-500 col-span-full py-8">Sección en mantenimiento técnico...</p>
                </div>
            </div>
        </section>

        <section id="robux" class="tab-content hidden section-padding">
            <div class="container-wide text-center">
                <h2 class="text-4xl font-bold mb-6 titanium-title">🪙 Conseguir Robux</h2>
                <div id="robuxContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <p class="text-center text-zinc-500 col-span-full py-8">Sección en mantenimiento técnico...</p>
                </div>
            </div>
        </section>

        <section id="adminFormSection" class="section-padding tab-content hidden">
            <div class="max-w-md mx-auto bg-zinc-900 p-6 rounded-xl border border-zinc-800 neo-glass">
                <h3 class="text-xl font-bold mb-4 titanium-title"><i class="fas fa-user-shield"></i> Panel Administrador</h3>
                <div class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Nombre del Juego</label>
                        <input id="newGameName" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">URL de la Imagen</label>
                        <input id="newGameImage" type="text" placeholder="https://..." class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Código Promocional</label>
                        <input id="newGameCodes" type="text" placeholder="Ej: KRAKEN2026" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <button id="quickAddGameBtn" class="w-full btn-cyber py-2 rounded font-bold text-sm">Guardar en Supabase</button>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

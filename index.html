<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxSample - Códigos y Guías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="sticky top-0 z-40 neo-glass">
        <div class="container-wide flex items-center justify-between h-16 px-4">
            
            <div id="logoAdminTrigger" class="flex items-center space-x-4 cursor-pointer select-none shrink-0">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-electric to-magenta-cyber rounded-lg flex items-center justify-center">
                    <i class="fas fa-gamepad text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-bold titanium-title">RobloxSample</h1>
            </div>

            <nav class="flex items-center space-x-4 md:space-x-6 overflow-x-auto max-w-[55%] md:max-w-full py-1 scrollbar-none">
                <button onclick="showSection('inicio')" class="nav-cyber whitespace-nowrap">Inicio</button>
                <button onclick="showSection('juegos')" class="nav-cyber whitespace-nowrap">Códigos</button>
                <button onclick="showSection('ropa')" class="nav-cyber whitespace-nowrap">Ropa</button>
                <button onclick="showSection('robux')" class="nav-cyber whitespace-nowrap">Robux</button>
            </nav>

            </div>
    </header>

    <main>
        <section id="inicio" class="section-padding tab-content">
            <div class="container-wide">
                <div class="neo-glass p-8 max-w-4xl mx-auto text-center">
                    <h2 class="text-5xl font-bold mb-6 titanium-title">🎁 Sorteo Exclusivo</h2>
                    <p class="text-xl text-gray-300 mb-8">Participa por Robux y items limitados.</p>
                    <div id="sorteoContainer" class="max-w-md mx-auto">
                        <div id="countdown" class="countdown-cyber mb-6 hidden">45</div>
                        <div class="progress-cyber hidden" id="progressBar">
                            <div class="progress-cyber-fill" id="progressFill"></div>
                        </div>
                        <button id="participarBtn" class="btn-cyber px-10 py-4 rounded-xl text-lg font-bold">
                            Participar Ahora
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="juegos" class="section-padding tab-content hidden">
            <div class="container-wide px-4">
                <h2 class="text-4xl font-bold mb-8 text-center titanium-title">🎮 Códigos de Juegos</h2>
                
                <div class="max-w-md mx-auto mb-8 relative">
                    <input id="searchInput" type="text" oninput="filterGames()" placeholder="Buscar tu juego favorito..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition-all">
                </div>

                <div id="gamesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <p class="text-center text-zinc-500 col-span-full py-8">Cargando base de datos...</p>
                </div>
            </div>
        </section>

        <section id="ropa" class="section-padding tab-content hidden">
            <div class="container-wide text-center">
                <h2 class="text-4xl font-bold mb-6 titanium-title">👕 Ropa Limitada</h2>
                <div id="clothingContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <p class="text-center text-zinc-500 col-span-full py-8">Próximamente catálogo de ropa...</p>
                </div>
            </div>
        </section>

        <section id="robux" class="section-padding tab-content hidden">
            <div class="container-wide text-center">
                <h2 class="text-4xl font-bold mb-6 titanium-title">🪙 Conseguir Robux</h2>
                <div id="robuxContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <p class="text-center text-zinc-500 col-span-full py-8">Próximamente nuevos métodos...</p>
                </div>
            </div>
        </section>

        <section id="adminFormSection" class="section-padding tab-content hidden">
            <div class="max-w-md mx-auto bg-zinc-900 p-6 rounded-xl border border-zinc-800 neo-glass">
                <h3 class="text-xl font-bold mb-4 titanium-title"><i class="fas fa-user-shield"></i> Panel Administrador</h3>
                <div class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Nombre del Juego</label>
                        <input id="newGameName" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">URL de la Imagen</label>
                        <input id="newGameImage" type="text" placeholder="https://..." class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Código Promocional</label>
                        <input id="newGameCodes" type="text" placeholder="Ej: KRAKEN2026" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-white focus:outline-none">
                    </div>
                    <button id="quickAddGameBtn" class="w-full btn-cyber py-2 rounded font-bold text-sm">Guardar en Supabase</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ⚠️ COLOCA AQUÍ TUS CREDENCIALES DE SUPABASE
        const SUPABASE_URL = "https://tu-url-de-supabase.supabase.co"; 
        const SUPABASE_KEY = "tu-clave-anon-publica-aqui";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let todosLosJuegos = [];

        // Cambiar de pestaña de manera limpia
        function showSection(sectionId) {
            document.querySelectorAll('.tab-content').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');

            if(sectionId === 'juegos') { fetchJuegos(); }
        }

        // 🔐 ACCESOS SECRETOS AL PANEL (EASTER EGGS)
        
        // PC: Tecla F8
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F8') {
                e.preventDefault();
                showSection('adminFormSection');
            }
        });

        // Celular: 8 clics en el logo de RobloxSample
        let clicks = 0;
        let clickTimeout;
        document.getElementById('logoAdminTrigger').addEventListener('click', () => {
            clicks++;
            clearTimeout(clickTimeout);
            clickTimeout = setTimeout(() => { clicks = 0; }, 1500);

            if (clicks === 8) {
                clicks = 0;
                showSection('adminFormSection');
            }
        });

        // Traer la información real de Supabase
        async function fetchJuegos() {
            const container = document.getElementById('gamesContainer');
            try {
                const { data: juegos, error } = await supabaseClient.from('juegos').select('*');
                if (error) throw error;
                todosLosJuegos = juegos || [];
                renderGamesList(todosLosJuegos);
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-400 col-span-full">Error al conectar con la base de datos.</p>`;
            }
        }

        // Dibujar las tarjetas con tu diseño e iconos intactos
        function renderGamesList(lista) {
            const container = document.getElementById('gamesContainer');
            if (lista.length === 0) {
                container.innerHTML = `<p class="text-center text-zinc-400 col-span-full py-8">No se encontraron juegos.</p>`;
                return;
            }
            container.innerHTML = "";
            lista.forEach(juego => {
                const nombre = juego.nombre || "Juego de Roblox";
                const imagen = juego.imagen_url || "https://images.rbxcdn.com/9fbda9da694da83928424fb84236a281.png";
                const codigo = juego.codigo || "No activo";
                const jugadores = juego.jugadores !== undefined ? juego.jugadores : "1.5K";

                container.innerHTML += `
                    <div class="neo-glass rounded-xl overflow-hidden p-4">
                        <img src="${imagen}" alt="${nombre}" class="w-full h-40 object-cover rounded-lg mb-3">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-lg text-white truncate max-w-[70%]">${nombre}</h3>
                            <span class="text-xs text-zinc-400"><i class="fas fa-users text-cyan-400"></i> ${jugadores}</span>
                        </div>
                        <div class="bg-zinc-950 p-2 rounded border border-zinc-800 flex items-center justify-between">
                            <code class="text-pink-400 font-mono text-sm font-bold">${codigo}</code>
                            <button onclick="navigator.clipboard.writeText('${codigo}'); alert('¡Código copiado!');" class="text-zinc-400 hover:text-white text-xs px-2 py-1 bg-zinc-800 rounded">Copiar</button>
                        </div>
                    </div>`;
            });
        }

        // Buscar en tiempo real
        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = todosLosJuegos.filter(juego => juego.nombre.toLowerCase().includes(query));
            renderGamesList(filtrados);
        }

        // Guardar juego desde el Panel Admin
        document.getElementById('quickAddGameBtn').addEventListener('click', async () => {
            const nombre = document.getElementById('newGameName').value;
            const imagen = document.getElementById('newGameImage').value;
            const codigo = document.getElementById('newGameCodes').value;

            if (!nombre || !codigo) return;
            try {
                const { error } = await supabaseClient.from('juegos').insert([{ nombre, imagen_url: imagen, codigo }]);
                if (error) throw error;
                alert("¡Juego guardado correctamente!");
                document.getElementById('newGameName').value = '';
                document.getElementById('newGameImage').value = '';
                document.getElementById('newGameCodes').value = '';
                showSection('juegos');
            } catch (err) { alert("Error: " + err.message); }
        });
    </script>
</body>
</html>
